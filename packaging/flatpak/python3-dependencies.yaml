# Generated by scripts/sync_flatpak_deps.py from requirements/runtime.txt, the
# hash-pinned export `just lock` writes out of uv.lock. Run `just flatpak-deps`
# after any dependency change; `just flatpak-deps-check` and
# tests/test_flatpak_packaging.py fail when this file falls behind.
#
# Do not hand-edit the url/sha256 pairs. Every other line is hand-written and
# the script preserves it: pywhispercpp needs a Vulkan build, a version
# injected into setup.py, and whisper.cpp's shared libraries symlinked onto
# the loader path, none of which a generator produces.
name: python3-dependencies
buildsystem: simple
build-commands: []
modules:
  - name: python3-pywhispercpp
    buildsystem: simple
    build-commands:
      # The PyPI sdist derives its version from git metadata, which is absent in
      # the offline Flatpak build, so inject the version explicitly. --no-same-owner
      # stops GNU tar from trying to restore the archive's uid inside the build
      # sandbox (where chown to an arbitrary uid is not permitted).
      - tar --no-same-owner -xzf pywhispercpp-1.5.0.tar.gz
      # The build runs under --no-build-isolation, where setuptools-scm is absent,
      # so a replace that matched nothing would not fail -- it would produce a wheel
      # carrying version 0.0.0. recognition_manager.py reads that metadata and
      # degrades GPU context_params below the floor in pyproject.toml, silently.
      # Assert the shape instead.
      - python3 -c "from pathlib import Path; p = Path('pywhispercpp-1.5.0/setup.py'); s = p.read_text(); n = 'setup(\\n    name=\"pywhispercpp\",'; assert n in s, 'pywhispercpp setup.py no longer matches the injection point'; p.write_text(s.replace(n, n + '\\n    version=\"1.5.0\",'))"
      - tar --owner=0 --group=0 -czf pywhispercpp-1.5.0.tar.gz pywhispercpp-1.5.0
      - PYWHISPERCPP_VERSION=1.5.0 NO_REPAIR=1 GGML_VULKAN=1 pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "pywhispercpp" --no-build-isolation
      # whisper.cpp installs its shared libraries next to the extension module.
      # Symlink them onto the default loader path so the extension resolves them
      # without a runtime LD_LIBRARY_PATH, regardless of the SDK's Python minor
      # version or the exact whisper.cpp soname.
      - |
        set -eu
        sitedir="$(find "${FLATPAK_DEST}/lib" -maxdepth 2 -type d -name site-packages | head -n1)"
        echo "Linking whisper.cpp libraries from: ${sitedir}"
        find "${sitedir}" -maxdepth 2 \( -name 'libggml*.so*' -o -name 'libwhisper*.so*' \) \
          -exec ln -sf {} "${FLATPAK_DEST}/lib/" \;
        ls -l "${FLATPAK_DEST}/lib/" | grep -E 'libggml|libwhisper' || true
    sources:
      - &id002
        type: file
        url: https://files.pythonhosted.org/packages/0b/a7/71ac2cff56fec219ed242bb11b8efb69fcc4bec75db06fb7bfe35de520e6/certifi-2026.7.22-py3-none-any.whl
